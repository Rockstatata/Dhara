# --------------------------------------------------------------- structure
# How many background clauses to attach, as weights. Sampling from a spread
# rather than a fixed count is what reproduces the real length variance
# (sd 56.3) instead of a new, differently-shaped spike.
#
# 0 clauses keeps some short questions -- the real p10 is 11 words, so terse
# questions are part of the target distribution, just not all of it.
background_count_weights:
  # Deliberately long-tailed, not bell-shaped. The real questions have sd 56.3
  # across 11-167 words: some are two terse sentences, some are a full page of
  # family history. A bell curve around the mean reproduces the mean and misses
  # the shape, which is what the first narrative pass did (sd 11.98). Keeping
  # real weight on 0-1 clauses AND on 10-14 is what widens the spread.
  0: 10
  1: 10
  2: 10
  3: 10
  4: 9
  5: 8
  6: 8
  7: 7
  8: 6
  9: 5
  10: 5
  11: 4
  12: 4
  13: 3
  14: 3
