  criminal_procedure:
    - "থানায় একবার গিয়েছিলাম, কিন্তু ভালো ব্যবহার পাইনি।"
    - "ঘটনার কোনো সাক্ষী নেই।"
    - "আমার বিরুদ্ধে আগে কোনো অভিযোগ ছিল না।"

