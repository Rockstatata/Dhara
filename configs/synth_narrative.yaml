# Narrative scaffolding for synthetic questions.
#
# ## Why this file exists
#
# Fine-tune attempt 2 failed by query-space concentration (DECISIONS.md
# 2026-09-03): the encoder learned a narrow "citizen legal question" direction
# and every probe question collapsed onto it. Measuring the training questions
# against the real ones found the collapsed axis, and it was not the sentence
# frames — it was LENGTH:
#
# | | real mined questions | templates (attempt 2) |
# |---|---|---|
# | median length | 74 words | 11 words |
# | p10 - p90 | 11 - 167 | 7 - 16 |
# | std dev | 56.3 | 3.41 |
#
# Real citizen questions are newspaper legal-advice letters. People narrate:
# who they are, when they married, what their brother did, how much they earn,
# and only then ask the question. Roughly seven times longer than the templates
# they were trained against, with sixteen times the length variance. Training a
# retriever on terse one-liners and evaluating it on long narratives is a
# distribution mismatch severe enough on its own to produce attempt 2's result.
#
# So the generator composes:
#
#     [opener] + [0-3 background clauses] + [core situation + ask] + [closing]
#
# where the core comes from configs/synth_topics.yaml as before — the existing
# 400+ hand-authored templates are reused as the *ask*, not thrown away — and
# everything here is the narrative context wrapped around it.
#
# ## The rules this scaffolding obeys
#
# - **No statute vocabulary.** Every topic's `banned` list still applies to the
#   composed question, so scaffolding cannot smuggle in legal register.
# - **No answer-bearing detail.** Background clauses set a scene; they never
#   state the legal conclusion or name the Act. Otherwise the question would
#   leak its own answer and the overlap audit would (rightly) fail it.
# - **Some clauses are deliberately irrelevant.** Real letters are full of
#   detail that does not bear on the legal question — the writer's salary, how
#   the marriage was arranged, who disapproved. A retriever that only ever sees
#   surgically-relevant questions is not being trained on the real task.
# - **Length varies by design.** The composer samples how many background
#   clauses to attach, so the output spans one-liners through long letters
#   rather than clustering at any single length.

# ---------------------------------------------------------------- openers
# How a letter starts: who the writer is. Deliberately spans genders, ages,
# occupations, and family positions, because the corpus of real questions does.
# Grouped by the speaker they imply, because scaffolding and core must agree.
# A core saying "আমার স্বামী" has a female speaker; pairing it with "আমি একজন
# কৃষক" produces a persona no real letter would have. The composer reads the
# core for a gender cue and draws only from a compatible bucket, defaulting to
# `neutral` when the core gives no cue.
