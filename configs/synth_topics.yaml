# Citizen topic inventory for synthetic question generation.
#
# Each topic is a thing people in Bangladesh actually collide with, written the
# way they would describe it — not the way the statute names it. The generator
# renders `templates` against `slots` to produce questions, then matches those
# questions to provisions using `signature_bn` / `signature_en`.
#
# The direction matters and is the whole point (see src/dhara/synth.py): the
# question is written WITHOUT seeing the provision, so it cannot inherit the
# provision's vocabulary. `banned` lists the statute phrasing for the topic; any
# rendered question containing one is discarded as register leakage.
#
# `signature_en` is not optional. 37% of the corpus and 60% of the gold answers
# live in English-only Acts (Succession 1925, Penal Code 1860, CrPC 1898,
# Contract 1872, TPA 1882, Evidence 1872, Registration 1908, SAT 1950,
# Negotiable Instruments 1881, Guardians and Wards 1890). A topic with no English
# signature is invisible to exactly the slice the model is worst at.
#
# `require_*` prevents a topic from matching any section that merely mentions a
# common word. Without it, a dowry topic matches every provision containing নারী.

