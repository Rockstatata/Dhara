# Hand-anchored provisions per citizen topic.
#
# Why this file exists. Signature matching alone finds the right *Act* but often
# the wrong *section*: a talaq-procedure question matched MFLO 1961 s6 (Polygamy)
# when the answer is s7 (Talaq), and a "landlord won't accept my rent" question
# matched House Rent Control s26 (tenant's failure to hand over possession) when
# the answer is s19 (deposit of rent). Around half the tier-A positives were
# wrong at section level in the first generation run. Training a retriever on
# those teaches it that the wrong section answers the question, which is worse
# than not training at all.
#
# So the provisions below are named by hand, and every act_id / section number
# here was read out of corpus_v1 and checked against its printed title before
# being written down — not recalled from memory. Anchored pairs carry
# `label_source: anchor`; signature-matched pairs stay in the dataset at a lower
# tier so coverage does not collapse, but the anchors are what training leans on.
#
# This is still weak supervision. "This section is *about* what the question
# asks" is a weaker claim than the gold set's "this section *is* the answer",
# and no human adjudicated these pairs the way the 552 gold questions were
# adjudicated. They are training data and nothing else.
#
# Sections are written exactly as `provision_no_ascii` appears in the corpus.

