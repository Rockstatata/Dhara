    - "কাগজে তালাক লিখে দিলেই কি শেষ, নাকি কাউকে জানাতে হয়?"
    - "তালাক দেওয়ার পরে আমি কি আবার ওই স্বামীর কাছে ফিরে যেতে পারি?"
    - "চেয়ারম্যান অফিসে যে সালিশ বসে সেটা না হলে কি ছাড়াছাড়ি হয় না?"
    - "আমার স্বামী নিরুদ্দেশ, কেউ জানে না কোথায়। এখন আমি কী করব?"
