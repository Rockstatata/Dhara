# Second authoring pass: additional citizen phrasings per topic.
#
# The first generation run produced 3,230 pairs from only 254 distinct
# questions. Pair count was never the constraint — question *diversity* is. A
# bi-encoder fine-tuned on 254 phrasings learns those phrasings, and the gold
# set (552 real newspaper questions, none of them phrased like a template) is
# where that overfitting would show up as a null result.
#
# So this file exists purely to widen the surface. Same rules as
# synth_topics.yaml: written without looking at any provision, citizen register
# only, and subject to the same `banned` list and the same overlap filter. It is
# merged into each topic's `templates` at load time.
#
# Deliberate variation along the axes real questions vary on:
#   - narrative openings vs bare questions (real mined questions mostly narrate)
#   - first person vs third person ("আমার বোনের", "আমার এক আত্মীয়")
#   - procedural asks ("কোথায় যাব") vs substantive asks ("কত বছর জেল")
#   - length: one-liners through three-sentence situations

extra:

  divorce_talaq_procedure:
    - "আমার এক আত্মীয়ের স্বামী তাকে ছেড়ে দিয়েছে। মেয়েটি এখন কী কী দাবি করতে পারে?"
    - "তালাকের পর মেয়েরা কতদিন অপেক্ষা করে আবার বিয়ে করতে পারে?"
    - "স্বামী বিদেশে থাকে, দুই বছর ধরে কোনো যোগাযোগ নেই। আমি কি বিয়ে ভেঙে দিতে পারি?"
    - "স্বামী মানসিকভাবে অসুস্থ, সংসার চালাতে পারে না। এই কারণে কি আলাদা হওয়া যায়?"
